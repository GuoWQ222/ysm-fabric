// Modified for the unofficial Minecraft 26.x port (Fabric, NeoForge, Forge) by GuoWQ222, 2026 (see PORTING.md).
// Yes Steve Model 3.0-dev - unofficial Fabric 26.2 port, based on the upstream Forge 1.20.1 build.
plugins {
    id 'java-library'
    // Multi-loader: declared here, applied by gradle/loader-<loader>.gradle
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
    id 'com.google.protobuf' version '0.9.5'
    id 'com.gradleup.shadow' version '9.2.2'
}

// Multi-version (Fabric port): -Pmc=<version> applies versions/<version>.properties over gradle.properties. The
// checked-in sources are the 26.2 variant; other versions compile a copy processed by //#if MC ... blocks
// (buildSrc Preprocessor).
def ysmSourceMc = '26.2'
def ysmTargetMc = (findProperty('mc') ?: minecraft_version).toString()
if (ysmTargetMc != minecraft_version) {
    def versionFile = file("versions/${ysmTargetMc}.properties")
    if (!versionFile.exists())
        throw new GradleException("No versions/${ysmTargetMc}.properties")
    def overrides = new Properties()
    versionFile.withReader('UTF-8') { overrides.load(it) }
    overrides.each { key, value -> project.ext.set(key.toString(), value.toString().trim()) }
}
// -Pysm_set=key=value[;key=value]: test-only overrides applied after versions/<mc>.properties (e.g. a newer loader
// build; also as environment ORG_GRADLE_PROJECT_ysm_set for a test client)
if (findProperty('ysm_set')) {
    findProperty('ysm_set').toString().split(';').each { pair ->
        def kv = pair.split('=', 2)
        if (kv.length == 2)
            project.ext.set(kv[0].trim(), kv[1].trim())
    }
}
// -Ploader=fabric|neoforge|forge (default fabric)
ext.ysmLoader = (findProperty('loader') ?: 'fabric').toString()
if (!['fabric', 'neoforge', 'forge'].contains(ysmLoader))
    throw new GradleException("Unknown loader ${ysmLoader}")
apply plugin: [fabric: 'net.fabricmc.fabric-loom', neoforge: 'net.neoforged.moddev', forge: 'net.minecraftforge.gradle'][ysmLoader]

// Build-tool and declaration classpaths need these source sets before their compiler setup.
sourceSets { declaration }

// Dev-only visual test harness (separate mod, never in the release jar).
sourceSets {
    localtest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.declaration.output
        // main.runtimeClasspath is replaced later by gradle/declaration.gradle; name the declaration output here.
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.declaration.output
    }
}

ext.ysmExtraSources = (findProperty('extra_sources') ?: '').toString().split(',')*.trim().findAll { it }
// legacy mixin configs (ysm.<name>.mixins.json in src/legacy/<name>/resources) go with the extra sources
ysmExtraSources.each { name -> sourceSets.main.resources.srcDir "src/legacy/${name}/resources" }

// Other Minecraft versions: hand-written sources go through the preprocessor (generated source dirs are added later
// by the schema and compatibility scripts and stay as they are).
if (minecraft_version != ysmSourceMc || ysmLoader != 'fabric') {
    [main: 'src/main/java', localtest: 'src/localtest/java'].each { setName, dirPath ->
        def prepare = tasks.register("preprocess${setName.capitalize()}Java", com.elfmcys.ysm.gradle.PreprocessTask) {
            sources.from(file(dirPath))
            // versions/<mc>.properties "extra_sources": stand-ins for newer Minecraft APIs (src/legacy/<name>/java)
            if (setName == 'main')
                ysmExtraSources.each { name -> sources.from(file("src/legacy/${name}/java")) }
            minecraftVersion.set(minecraft_version)
            loader.set(ysmLoader)
            output.set(layout.buildDirectory.dir("preprocessed/${minecraft_version}/${setName}"))
            // versions/<mc>.remap, then the shared tables the version file names in "remaps" (e.g. below-26.1),
            // then the loader's table
            def shared = (findProperty('remaps') ?: '').toString().split(',')*.trim().findAll { it }
                    .collect { name -> file("versions/${name}.remap") }
            shared.findAll { !it.exists() }.each { throw new GradleException("No ${it}") }
            ([file("versions/${minecraft_version}.remap")] + shared + [file("versions/loader-${ysmLoader}.remap")])
                .findAll { it.exists() }.each { remaps.from(it) }
        }
        sourceSets.getByName(setName).java.setSrcDirs([prepare.flatMap { it.output }])
    }
}

// Upstream verification tests (JUnit). Fabric port: tests bound to Forge-era Minecraft APIs are excluded in
// gradle/test-exclusions.txt; the rest check the shared model, format, network and native logic.
def ysmTestExclusions = file('gradle/test-exclusions.txt').exists()
        ? file('gradle/test-exclusions.txt').readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
        : []
sourceSets {
    test {
        java.setSrcDirs(['src/verification/test/java', 'src/verification/shared/java'])
        java.exclude(ysmTestExclusions)
        resources.setSrcDirs(['src/verification/test/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.declaration.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.declaration.output
    }
}
apply from: 'gradle/local-properties.gradle'
apply from: 'gradle/native.gradle'

// mod_version names the Fabric build (e.g. 3.0-dev-fabric+mc26.2-local); NeoForge/Forge jars carry their loader
version = mod_version.toString().replace('-fabric+', "-${ysmLoader}+")
group = 'com.elfmcys.ysm'
base { archivesName = 'ysm' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Minecraft before 26.1 runs on Java 21 or 17: versions/<mc>.properties sets java_release
    options.release = (findProperty('java_release') ?: '25').toString() as int
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def mavenCentralHosts = ['repo.maven.apache.org', 'repo1.maven.org']
repositories.withType(MavenArtifactRepository).configureEach { repo ->
    if (!mavenCentralHosts.contains(repo.url.host)) {
        repo.content {
            excludeGroup 'com.google.protobuf'
            excludeGroup 'us.hebi.quickbuf'
        }
    }
}

configurations {
    // Fabric port: libraries that FCAP ships as nested jars, needed on plain JVM classpaths (build tools, tests).
    nestedLibs
    ysmImplementation
    implementation.extendsFrom ysmImplementation
}

ext.ysmBundledExpressionLibraries = Collections.unmodifiableMap([
        'dev.semaweave:semaweave-engine:0.1.0-SNAPSHOT'         : file('libs/semaweave-engine-0.1.0-SNAPSHOT.jar'),
        'dev.semaweave:semaweave-backend-janino:0.1.0-SNAPSHOT' : file('libs/semaweave-backend-janino-0.1.0-SNAPSHOT.jar'),
        'org.codehaus.janino:janino:3.1.12-semaweave'           : file('libs/janino-3.1.12-semaweave.jar')
])

dependencies {
    // Jade plugin (client/compat/jade), as 2.6.5 had
    compileOnly("maven.modrinth:jade:${jade_version}") { transitive = false }
    // Optional integrations (client/compat): APIs only, the mods stay optional at runtime. Modrinth version ids.
    compileOnly("maven.modrinth:carry-on:${carryon_version}") { transitive = false }
    compileOnly("maven.modrinth:better-combat:${bettercombat_version}") { transitive = false }
    compileOnly("maven.modrinth:player-animation-library:${playeranimlib_version}") { transitive = false }
    compileOnly("maven.modrinth:first-person-model:${firstperson_version}") { transitive = false }
    compileOnly("maven.modrinth:real-camera:${realcamera_version}") { transitive = false }
    // WTHIT plugin (client/compat/wthit, registered by waila_plugins.json on every loader); loader-neutral API
    compileOnly("maven.modrinth:wthit:${wthit_version}") { transitive = false }
    compileOnly("maven.modrinth:immersive-melodies:${immersivemelodies_version}") { transitive = false }
    compileOnly("maven.modrinth:immersive-aircraft:${immersiveaircraft_version}") { transitive = false }

    compileOnly 'org.jetbrains:annotations:26.0.2'

    ysmImplementation files('libs/quickbuf-runtime-1.4.1-ysm.jar')
    ysmImplementation files(ysmBundledExpressionLibraries.values())
    // File dependencies do not carry the runtime dependencies declared in their POMs.
    ysmImplementation 'org.codehaus.janino:commons-compiler:3.1.12'
    ysmImplementation 'org.yaml:snakeyaml:2.2'
    // Version parsing (Forge shipped maven-artifact; Fabric does not).
    ysmImplementation 'org.apache.maven:maven-artifact:3.9.9'
    // Night-config types appear in config code; Forge Config API Port bundles it at runtime.
    compileOnly 'com.electronwill.night-config:core:3.8.4'
    compileOnly 'com.electronwill.night-config:toml:3.8.4'
    nestedLibs 'com.electronwill.night-config:core:3.8.4'
    nestedLibs 'com.electronwill.night-config:toml:3.8.4'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    testImplementation 'com.google.protobuf:protobuf-java:3.21.12'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testRuntimeOnly 'com.electronwill.night-config:core:3.8.4'
    testRuntimeOnly 'com.electronwill.night-config:toml:3.8.4'
    // Fabric Loader supplies ASM and fastutil at runtime.
    compileOnly 'org.ow2.asm:asm:9.9.1'
    compileOnly 'org.ow2.asm:asm-tree:9.9.1'
}

ext.ysmCompatExcluded = (findProperty('compat_exclude') ?: '').toString().split(',')*.trim().findAll { it }

// Port in progress: other-mod compatibility code and the Forge-era mixins stay in the tree for reference
// but are not compiled; ported mixins live under mixin/platform and mixin/fabric.
sourceSets.main.java {
    exclude 'com/elfmcys/ysm/mixin/client/**'
    exclude 'com/elfmcys/ysm/mixin/plugin/**'
    exclude 'com/elfmcys/ysm/mixin/*.java'
    // Multi-loader: each loader compiles only its own glue package.
    ['fabric', 'neoforge', 'forge'].findAll { it != ysmLoader }.each { other -> exclude "com/elfmcys/ysm/${other}/**" }
    // Fabric-only integration (Mod Menu entry); the WTHIT plugin is built for every loader (WTHIT exists for all)
    if (ysmLoader != 'fabric') {
        exclude 'com/elfmcys/ysm/fabric/YsmModMenu.java'
    }
    // versions/<mc>.properties "compat_exclude": integrations without an API build for that Minecraft version
    ysmCompatExcluded.each { name -> exclude "com/elfmcys/ysm/client/compat/${name}/**" }
    // versions/<mc>.properties "exclude_sources": files written for newer Minecraft only (a stand-in in src/legacy
    // replaces them there)
    (findProperty('exclude_sources') ?: '').toString().split(',')*.trim().findAll { it }.each { exclude it }
}
// versions/<mc>.properties "drop_mixins": ysm.mixins.json entries for classes this Minecraft version lacks
def ysmDroppedMixins = (findProperty('drop_mixins') ?: '').toString().split(',')*.trim().findAll { it }
if (!ysmDroppedMixins.isEmpty()) {
    tasks.named('processResources') {
        inputs.property 'drop_mixins', ysmDroppedMixins.join(',')
        doLast {
            // the shared config and the loader's own (ysm.forge.mixins.json lists SoundEngineStreamMixin etc.)
            ['ysm.mixins.json', 'ysm.forge.mixins.json'].each { name ->
                def file = new File(destinationDir, name)
                if (!file.exists())
                    return
                def json = new groovy.json.JsonSlurper().parse(file)
                ['mixins', 'client', 'server'].each { key ->
                    if (json[key] != null)
                        json[key] = json[key].findAll { !ysmDroppedMixins.contains(it) }
                }
                file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }
    }
}
// WTHIT finds its plugins through waila_plugins.json: without the plugin classes the file goes too
if (ysmCompatExcluded.contains('wthit')) {
    processResources { exclude 'waila_plugins.json' }
} else if (ysmExtraSources.contains('wthit-initializer')) {
    // WTHIT before its split plugin API (the Forge builds for 1.20.2, 1.20.3 and 1.20.6) reads one plugin class from
    // "initializer"; src/legacy/wthit-initializer holds that class
    processResources {
        filesMatching('waila_plugins.json') {
            filter { line ->
                if (line.contains('"entrypoints"'))
                    return line.replaceFirst(/"entrypoints"\s*:\s*\{/,
                        '"initializer": "com.elfmcys.ysm.client.compat.wthit.YsmWthitPlugin",')
                if (line.contains('"common"') || line.contains('"client"') || line.trim() == '},')
                    return ''
                return line
            }
        }
    }
}

apply from: "gradle/loader-${ysmLoader}.gradle"
apply from: 'gradle/declaration.gradle'
apply from: 'gradle/builtin-index.gradle'
apply from: 'gradle/expression-compatibility.gradle'


processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'mc_range', mc_range
    filteringCharset 'UTF-8'
    from('LICENSE')
    from('NOTICE.md')
    // Diagnostics for other Minecraft versions: -Pmixin_lenient=true logs failing mixins instead of stopping the game
    // (the harness option mixinAudit=true then loads every mixin target once).
    if (project.hasProperty('mixin_lenient')) {
        inputs.property 'mixin_lenient', true
        filesMatching('ysm.mixins.json') {
            filter { line -> line.replace('"required": true', '"required": false').replace('"defaultRequire": 1', '"defaultRequire": 0') }
        }
    }
}

jar {
    manifest.attributes([
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${version}"
    ])
    archiveClassifier = 'raw'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

tasks.named('shadowJar') {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile }.map { project.zipTree(it.asFile) })
    from(sourceSets.declaration.output) {
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    from(tasks.named('relocateProcessorAsm', Jar).flatMap { it.archiveFile }.map { project.zipTree(it.asFile) })
    configurations = [project.configurations.ysmImplementation]
    archiveClassifier = ''
    addMultiReleaseAttribute = false
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.proto'
    exclude '/META-INF/maven/**'
    exclude '/META-INF/native-image/*'
    exclude '/META-INF/proguard/*'
    relocate 'us.hebi.quickbuf', 'com.elfmcys.quickbuf'
    relocate 'mixel', 'com.elfmcys.mixel'
    relocate 'dev.semaweave', 'com.elfmcys.ysm.internal.expression.semaweave'
    relocate 'org.codehaus.janino', 'com.elfmcys.ysm.internal.expression.janino'
    relocate 'org.codehaus.commons.compiler', 'com.elfmcys.ysm.internal.expression.commonscompiler'
    relocate 'org.yaml.snakeyaml', 'com.elfmcys.ysm.internal.snakeyaml'
    relocate 'org.apache.maven.artifact', 'com.elfmcys.ysm.internal.mavenartifact'
    // Every bundled library goes under com.elfmcys: Forge ships maven-artifact as a module, and two modules exporting
    // one package (org.apache.maven.repository) stopped a real Forge server; plexus-utils / nullanalysis likewise.
    relocate 'org.apache.maven.repository', 'com.elfmcys.ysm.internal.mavenrepository'
    relocate 'org.codehaus.plexus', 'com.elfmcys.ysm.internal.plexus'
    relocate 'org.codehaus.commons.nullanalysis', 'com.elfmcys.ysm.internal.expression.nullanalysis'
    // Loom writes the nested-jar list ("jars") into fabric.mod.json while building the plain jar. Keep that copy, not
    // the unprocessed resource (EXCLUDE keeps the first duplicate and the main output comes first): without the list
    // Fabric never loads the bundled Forge Config API Port and a real install fails (IConfigSpec missing).
    def mainResources = sourceSets.main.output.resourcesDir.toPath().toAbsolutePath().normalize()
    eachFile { details ->
        if (details.path == 'fabric.mod.json' && details.file.toPath().toAbsolutePath().normalize().startsWith(mainResources))
            details.exclude()
    }
    doLast {
        // no class outside com.elfmcys (META-INF aside): an unrelocated library package can collide with the loader's
        // or another mod's module (split package) and stop the game
        def shaded = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def foreign = shaded.entries().toList().collect { it.name }
                .findAll { it.endsWith('.class') && !it.startsWith('com/elfmcys/') && !it.startsWith('META-INF/') }
                .collect { it.substring(0, it.lastIndexOf('/') + 1) }.unique()
            if (!foreign.isEmpty())
                throw new GradleException("release jar: classes outside com/elfmcys (relocate them): ${foreign}")
        } finally {
            shaded.close()
        }
        // and no call into the loader or Minecraft that names a relocated library type (it could not link)
        com.elfmcys.ysm.gradle.RelocationCheck.check(archiveFile.get().asFile, 'com/elfmcys/ysm/internal/')
        if (ysmLoader == 'fabric') {
            def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
            try {
                def text = zip.getInputStream(zip.getEntry('fabric.mod.json')).text
                def nested = zip.entries().toList().findAll { it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }
                def unlisted = nested.findAll { !text.contains("\"${it.name}\"") }
                if (!unlisted.isEmpty())
                    throw new GradleException("release jar: fabric.mod.json does not list nested jars ${unlisted*.name}")
            } finally {
                zip.close()
            }
        }
    }
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }

// Protobuf sources (applied last: it re-adds generated roots to every source set).
apply from: 'gradle/schema.gradle'

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'mock'
    }
    // Aggregate transfer tests exceed 128 MiB alongside initialized game and compiler fixtures.
    maxHeapSize = '1g'
    // Without the Wine Fox built-ins (public repository), skip the upstream tests that read their assets.
    if (!file('src/main/resources/assets/ysm/builtin/wine_fox').isDirectory()) {
        filter {
            file('gradle/test-exclusions-winefox.txt').readLines()
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .each { excludeTestsMatching it }
        }
    }
}
