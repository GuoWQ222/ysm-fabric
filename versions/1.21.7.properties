# Minecraft 1.21.7 (Forge only: -Pmc=1.21.7 -Ploader=forge). Java 21 (java_release: javac target and the dev runs' runtime).
minecraft_version=1.21.7
mc_range=~1.21.7
mod_version=3.0-dev-fabric+mc1.21.7
java_release=21
forge_version=1.21.7-57.0.3
# the Forge build the jar was compiled and tested against (older builds of the line can lack APIs it uses)
forge_range=[57.0.3,)
mc_range_maven=[1.21.7,1.21.8)
remaps=below-26.1,below-1.21.11,below-1.21.9
# Iris (compile only; no Iris on Forge): the 26.1 API matches the source's pre-26.2 branch
iris_version=1.11.4+26.1-fabric
# WTHIT plugin (compile only): this version's Forge build of WTHIT forge-16.0.4 (Modrinth version id)
wthit_version=hpyT6OWw
# no Jade for Forge after 1.20.4 (Jade became NeoForge / Fabric only): the Jade plugin is left out
compat_exclude=jade
# Forge before 1.21.10 ships no MixinExtras: bundled (loader-forge.gradle)
mixinextras_forge=0.5.4
# Stand-ins (src/legacy/<name>): projection buffers before 26.1 (three classes; 26.1 has one)
extra_sources=projection-buffers,pip-readback,submit,gui-hud
# 1.21.9 render/input mixins: the submit stand-ins carry older-API counterparts (src/legacy/submit)
drop_mixins=fabric.client.ProjectionMatrixBufferMixin,fabric.client.LivingEntityRendererMixin,fabric.client.EntityRenderDispatcherMixin,fabric.client.ItemInHandRendererMixin,fabric.client.InputEventsMixin,fabric.client.MouseButtonEventsMixin
exclude_sources=com/elfmcys/ysm/mixin/fabric/client/ProjectionMatrixBufferMixin.java,com/elfmcys/ysm/mixin/fabric/client/LivingEntityRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/EntityRenderDispatcherMixin.java,com/elfmcys/ysm/mixin/fabric/client/ItemInHandRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/InputEventsMixin.java,com/elfmcys/ysm/mixin/fabric/client/MouseButtonEventsMixin.java
