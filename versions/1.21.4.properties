# Minecraft 1.21.4 (Forge only: -Pmc=1.21.4 -Ploader=forge). Java 21 (java_release: javac target and the dev runs' runtime).
minecraft_version=1.21.4
mc_range=~1.21.4
mod_version=3.0-dev-fabric+mc1.21.4
java_release=21
forge_version=1.21.4-54.1.22
# the Forge build the jar was compiled and tested against (older builds of the line can lack APIs it uses)
forge_range=[54.1.22,)
mc_range_maven=[1.21.4,1.21.5)
remaps=below-26.1,below-1.21.11,below-1.21.9,below-1.21.6,below-1.21.5,forge-eventbus6
# Iris (compile only; no Iris on Forge): the 26.1 API matches the source's pre-26.2 branch
iris_version=1.11.4+26.1-fabric
# WTHIT plugin (compile only): this version's Forge build of WTHIT forge-14.6.2 (Modrinth version id)
wthit_version=VzkJbbTf
# no Jade for Forge after 1.20.4 (Jade became NeoForge / Fabric only): the Jade plugin is left out
compat_exclude=jade
# Forge before 1.21.10 ships no MixinExtras: bundled (loader-forge.gradle)
mixinextras_forge=0.5.4
# Stand-ins (src/legacy/<name>; a stand-in at the same path replaces the main file)
extra_sources=submit,gui-immediate,pre-pipelines
drop_mixins=fabric.client.LivingEntityRendererMixin,fabric.client.EntityRenderDispatcherMixin,fabric.client.ItemInHandRendererMixin,fabric.client.InputEventsMixin,fabric.client.MouseButtonEventsMixin,fabric.client.ProjectionMatrixBufferMixin,fabric.client.GuiEntityRendererMixin,fabric.client.GuiGraphicsExtractorAccessor,fabric.client.PictureInPictureRendererAccessor,fabric.LivingEntityEquipmentAccessor,SoundEngineStreamMixin
exclude_sources=com/elfmcys/ysm/mixin/fabric/client/LivingEntityRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/EntityRenderDispatcherMixin.java,com/elfmcys/ysm/mixin/fabric/client/ItemInHandRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/InputEventsMixin.java,com/elfmcys/ysm/mixin/fabric/client/MouseButtonEventsMixin.java,com/elfmcys/ysm/mixin/fabric/client/ProjectionMatrixBufferMixin.java,com/elfmcys/ysm/client/gui/pip/YsmGuiModelRenderer.java,com/elfmcys/ysm/client/gui/pip/GuiScissor.java,com/elfmcys/ysm/mixin/fabric/client/GuiEntityRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/GuiGraphicsExtractorAccessor.java,com/elfmcys/ysm/mixin/fabric/client/PictureInPictureRendererAccessor.java,com/elfmcys/ysm/mixin/fabric/LivingEntityEquipmentAccessor.java,com/elfmcys/ysm/forge/mixin/SoundEngineStreamMixin.java
