# Minecraft 1.21.10 (Forge only: -Pmc=1.21.10 -Ploader=forge). Java 21 (java_release: javac target and the dev runs' runtime).
minecraft_version=1.21.10
mc_range=~1.21.10
mod_version=3.0-dev-fabric+mc1.21.10
java_release=21
forge_version=1.21.10-60.1.18
# the Forge build the jar was compiled and tested against (older builds of the line can lack APIs it uses)
forge_range=[60.1.18,)
mc_range_maven=[1.21.10,1.21.11)
remaps=below-26.1,below-1.21.11
# Iris (compile only; no Iris on Forge): the 26.1 API matches the source's pre-26.2 branch
iris_version=1.11.4+26.1-fabric
# WTHIT plugin (compile only): this version's Forge build of WTHIT forge-17.5.3 (Modrinth version id)
wthit_version=BDr2vhJX
# no Jade for Forge after 1.20.4 (Jade became NeoForge / Fabric only): the Jade plugin is left out
compat_exclude=jade
# Stand-ins (src/legacy/<name>): projection buffers before 26.1 (three classes; 26.1 has one)
extra_sources=projection-buffers,pip-readback
drop_mixins=fabric.client.ProjectionMatrixBufferMixin
exclude_sources=com/elfmcys/ysm/mixin/fabric/client/ProjectionMatrixBufferMixin.java
