# Minecraft 1.20.3 (Forge only: -Pmc=1.20.3 -Ploader=forge). Java 17 (java_release: javac target and the dev runs' runtime).
minecraft_version=1.20.3
mc_range=~1.20.3
mod_version=3.0-dev-fabric+mc1.20.3
java_release=17
forge_version=1.20.3-49.0.2
# the Forge build the jar was compiled and tested against (older builds of the line can lack APIs it uses)
forge_range=[49.0.2,)
mc_range_maven=[1.20.3,1.20.4)
remaps=below-26.1,below-1.21.11,below-1.21.9,below-1.21.6,below-1.21.5,below-1.21.4,below-1.21.2,below-1.21,below-1.20.5,pre-rl-factories,forge-eventbus6,pre-tick-subevents
# Iris (compile only; no Iris on Forge): the 26.1 API matches the source's pre-26.2 branch
iris_version=1.11.4+26.1-fabric
# WTHIT plugin (compile only): WTHIT forge-10.0.1 (Modrinth version id), the only Forge build that runs on 1.20.3 (later
# ones need Bad Packets 0.6, which needs Minecraft 1.20.4, although Modrinth tags them 1.20.3); it predates WTHIT's split
# plugin API (src/legacy/wthit-initializer)
wthit_version=3VHdEE4d
# Jade plugin (compile only): Jade 13.2.1 for Forge (Modrinth version id)
jade_version=W8oT3BAr
# Forge before 1.21.10 ships no MixinExtras: bundled (loader-forge.gradle)
mixinextras_forge=0.5.4
# Stand-ins (src/legacy/<name>; a stand-in at the same path replaces the main file)
extra_sources=submit,gui-immediate,wthit-initializer,pre-pipelines,pre-item-models,pre-render-states,pre-delta-tracker,pre-byte-buffer-builder,pre-payload-types,pre-data-components
drop_mixins=fabric.client.LivingEntityRendererMixin,fabric.client.EntityRenderDispatcherMixin,fabric.client.ItemInHandRendererMixin,fabric.client.InputEventsMixin,fabric.client.MouseButtonEventsMixin,fabric.client.ProjectionMatrixBufferMixin,fabric.client.GuiEntityRendererMixin,fabric.client.GuiGraphicsExtractorAccessor,fabric.client.PictureInPictureRendererAccessor,fabric.LivingEntityEquipmentAccessor,SoundEngineStreamMixin,fabric.client.EntityRenderStateDataMixin,fabric.client.EntityRendererStateMixin,fabric.client.ByteBufferBuilderAccessor
exclude_sources=com/elfmcys/ysm/mixin/fabric/client/LivingEntityRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/EntityRenderDispatcherMixin.java,com/elfmcys/ysm/mixin/fabric/client/ItemInHandRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/InputEventsMixin.java,com/elfmcys/ysm/mixin/fabric/client/MouseButtonEventsMixin.java,com/elfmcys/ysm/mixin/fabric/client/ProjectionMatrixBufferMixin.java,com/elfmcys/ysm/client/gui/pip/YsmGuiModelRenderer.java,com/elfmcys/ysm/client/gui/pip/GuiScissor.java,com/elfmcys/ysm/mixin/fabric/client/GuiEntityRendererMixin.java,com/elfmcys/ysm/mixin/fabric/client/GuiGraphicsExtractorAccessor.java,com/elfmcys/ysm/mixin/fabric/client/PictureInPictureRendererAccessor.java,com/elfmcys/ysm/mixin/fabric/LivingEntityEquipmentAccessor.java,com/elfmcys/ysm/forge/mixin/SoundEngineStreamMixin.java,com/elfmcys/ysm/mixin/fabric/client/EntityRenderStateDataMixin.java,com/elfmcys/ysm/mixin/fabric/client/EntityRendererStateMixin.java,com/elfmcys/ysm/mixin/fabric/client/ByteBufferBuilderAccessor.java
# Forge before 1.21 bundles Mixin 0.8.5: compatibility levels end at JAVA_17
mixin_compat=JAVA_17
# Forge for this version runs on SRG member names: the release jar is renamed and the mixins get a refmap (loader-forge.gradle)
reobf_srg=true
